name: Build & Deploy Web Flasher

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e cyd

      - name: Assemble site with firmware images
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r docs/* site/

          BUILD_DIR=.pio/build/cyd
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n1)

          cp "$BUILD_DIR/bootloader.bin" site/bootloader.bin
          cp "$BUILD_DIR/partitions.bin" site/partitions.bin
          cp "$BOOT_APP0" site/boot_app0.bin
          cp "$BUILD_DIR/firmware.bin" site/firmware.bin

          VERSION="${GITHUB_REF_NAME:-dev}"
          python - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          with open("site/manifest.json") as f:
              data = json.load(f)
          data["version"] = version
          with open("site/manifest.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
